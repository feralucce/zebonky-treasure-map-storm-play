<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Treasure Map Storm</title>
  <!-- Prototype only: self-host these fonts before launch so no request leaves zebonky.com. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=Poppins:wght@600;800&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #2b1d12;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #game { width: 100%; height: 100%; }
    /* Phones held upright (2026-11-20): the game is wide, so upright it was a
       thin strip with tiny buttons. This covers it and asks for sideways;
       src/main.js pauses the game while it shows. A Surface or a laptop
       (it has a mouse or pen to hover) never sees it. */
    #turn {
      display: none;
      position: fixed; inset: 0; z-index: 10;
      background: #2b1d12; color: #f3dfb3;
      flex-direction: column; align-items: center; justify-content: center;
      gap: 28px; padding: 24px; text-align: center;
      font-family: Poppins, sans-serif; font-weight: 800; font-size: 26px;
    }
    #turn small { font-family: Nunito, sans-serif; font-weight: 600; font-size: 17px; opacity: 0.8; }
    #turn .phone {
      width: 64px; height: 112px; border: 6px solid #f3dfb3; border-radius: 14px;
      box-sizing: border-box; position: relative;
      animation: turn-phone 2.4s ease-in-out infinite;
    }
    #turn .phone::after {
      content: ''; position: absolute; left: 50%; bottom: 6px; width: 14px; height: 4px;
      margin-left: -7px; border-radius: 2px; background: #f3dfb3;
    }
    @keyframes turn-phone {
      0%, 25% { transform: rotate(0deg); }
      55%, 85% { transform: rotate(-90deg); }
      100% { transform: rotate(0deg); }
    }
    @media (orientation: portrait) and (hover: none) and (pointer: coarse) {
      #turn { display: flex; }
    }
  </style>
</head>
<body>
  <div id="turn">
    <div class="phone"></div>
    <div>Turn your phone sideways</div>
    <small>Then the game fills the screen.</small>
  </div>
  <div id="game"></div>
  <script src="vendor/phaser.min.js?v=4607924"></script>
  <script src="vendor/qrcode.min.js?v=4607924"></script>
  <script type="module" src="src/main.js?v=4607924"></script>
</body>
</html>
